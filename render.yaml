services:
  - type: web
    name: data-science-workspace-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port 10000 --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://data-science-topaz.vercel.app
      - key: ADMIN_KEY
        generateValue: true
